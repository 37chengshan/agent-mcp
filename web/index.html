<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Agent MCP · 对话图</title>
<style>
:root{--bg:#f3f1eb;--panel:#fff;--ink:#1d1d1b;--muted:#747169;--accent:#d75a36;--soft:#f7e5de;--line:#d7d3c8;--green:#347856;--red:#b83c31;--amber:#9d721d;--gray:#8c8981;--claude:#b95532;--grok:#a8781d;--opencode:#327258;--omp:#5d5798;--atomcode:#286ca6;--mono:"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{display:grid;grid-template-rows:62px minmax(0,1fr) 28px;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding:0 18px;background:#1d1d1b;color:#faf8f2;border-bottom:3px solid var(--accent)}
.brand{display:flex;align-items:center;gap:11px}.kicker{font:700 9px/1 var(--mono);letter-spacing:.14em;color:#aaa69d;text-transform:uppercase}h1{margin:0;font-size:19px;letter-spacing:-.035em}.stats{display:flex;justify-content:center;min-width:0;overflow:hidden}.stat{display:flex;align-items:baseline;gap:5px;padding:0 10px;border-left:1px solid #3c3b37;white-space:nowrap}.stat:first-child{border-left:0}.stat .lbl{font:9px/1 var(--mono);color:#918e86;text-transform:uppercase}.stat b{font:700 11px/1 var(--mono)}.stat.run b{color:#f27c57}.stat.queued b{color:#d4a84e}.stat.done b{color:#72b68b}.stat.fail b{color:#e27367}
select.sess{width:190px;height:32px;border:1px solid #4a4843;border-radius:4px;background:#292927;color:#faf8f2;padding:0 9px;font:12px inherit}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0;overflow:hidden}#map-pane{min-width:0;min-height:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;background-color:var(--bg);background-image:linear-gradient(rgba(29,29,27,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(29,29,27,.04) 1px,transparent 1px);background-size:24px 24px}#map-hint{position:sticky;left:0;z-index:2;width:100%;height:39px;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid var(--line);background:rgba(243,241,235,.95);color:var(--muted);font-size:11px;backdrop-filter:blur(6px)}#map{height:calc(100% - 39px);min-width:100%;padding:10px 14px}#detail-pane{overflow-y:auto;border-left:1px solid #bdb9af;background:var(--panel);padding:15px 17px 26px}
footer{display:flex;align-items:center;gap:12px;padding:0 15px;border-top:1px solid #c9c5bb;background:#e9e6de;color:var(--muted);font:10px/1 var(--mono);white-space:nowrap;overflow:hidden}.dot{width:7px;height:7px;border-radius:50%;background:#9f9b92}.dot.ok{background:var(--green)}.dot.bad{background:var(--amber)}.live-b{font:700 9px/1 var(--mono);padding:2px 5px;border:1px solid #b7b3a9}.live-b.live{color:var(--green)}.live-b.buf{color:var(--amber)}
svg#tree{display:block;height:100%}svg#tree .node{cursor:pointer}svg#tree .node rect{fill:#fff;stroke-width:1.25;transition:filter .14s,stroke-width .14s}svg#tree .node:hover rect{filter:drop-shadow(0 3px 7px rgba(29,29,27,.15))}svg#tree .node.selected rect{stroke-width:3}svg#tree .node.run rect{animation:pulse 1.7s ease-in-out infinite}svg#tree .turn rect{fill:var(--soft);stroke:var(--accent)}@keyframes pulse{50%{opacity:.72}}
.dk{display:flex;align-items:center;gap:7px;margin:17px 0 8px;color:var(--muted);font:700 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}.dk::after{content:"";height:1px;flex:1;background:var(--line)}h2.aname{margin:0;font-size:18px;line-height:1.2;letter-spacing:-.03em;word-break:break-all}.cli-badge{display:inline-block;margin-left:7px;padding:3px 6px;border-radius:3px;color:#fff;font:700 9px/1 var(--mono);vertical-align:3px;text-transform:uppercase}.subtitle{margin-top:3px;color:var(--muted);font-size:10.5px;word-break:break-all}
table.sum{width:100%;border-collapse:collapse;font-size:11.5px}table.sum td{padding:5px 0;border-bottom:1px solid #eeece6;word-break:break-all}table.sum td:first-child{width:74px;color:var(--muted)}.cur-act{padding:8px 10px;border-left:3px solid var(--accent);background:#f5f3ed;font-size:11px}.cur-act .tn{font-weight:700}.cur-act .in{color:var(--muted);font:10px/1.45 var(--mono);white-space:pre-wrap}.msgs{display:flex;flex-direction:column;gap:5px}.msg{padding:7px 9px;border:1px solid #e4e1d8;border-radius:4px;background:#f8f6f1;font-size:11px;white-space:pre-wrap;word-break:break-word}.msg.delta{border-style:dashed;color:var(--muted)}.msg .seq{margin-right:5px;color:#9f9b92;font:9px/1 var(--mono)}.events{font-size:9.5px}.ev{display:grid;grid-template-columns:32px 106px minmax(0,1fr);gap:5px;padding:3px 0;border-bottom:1px solid #f0eee8}.ev .seq{color:#9f9b92;font-family:var(--mono)}.ev .tp{font-weight:650;white-space:nowrap}.ev .py{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.empty{padding:24px 0;text-align:center;color:var(--muted);font-size:11px}.legend{color:var(--muted);font:9px var(--mono)}.legend .sw{display:inline-block;width:12px;height:2px;margin:0 4px 2px 8px;vertical-align:middle}
.operator{margin:13px -17px 0;padding:11px 17px;border-block:1px solid var(--line);background:#f4f1e9}.operator label{display:block;margin-bottom:6px;color:var(--muted);font:700 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}.operator textarea{width:100%;min-height:72px;padding:8px 9px;border:1px solid #bebab0;border-radius:4px;resize:vertical;font:12px/1.45 inherit}.operator textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.mode-tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:9px;border-bottom:1px solid #bebab0}.mode-tabs button{padding:5px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:650 10px inherit}.mode-tabs button.active{border-bottom-color:var(--accent);color:var(--ink)}.op-actions{display:grid;grid-template-columns:auto auto;gap:6px;margin-top:8px}.op-btn{height:33px;padding:0 10px;border:1px solid #bebab0;border-radius:4px;background:#fff;color:var(--ink);font:650 10.5px inherit}.op-btn.primary{background:#1e1e1b;border-color:#1e1e1b;color:#fff}.op-btn.danger{color:var(--red);border-color:#d4a09a}.op-btn:disabled{opacity:.42}.op-note{grid-column:1/-1;color:var(--muted);font-size:9.5px}.op-feedback{min-height:16px;margin-top:5px;color:var(--green);font-size:10px}.op-feedback.error{color:var(--red)}.task-handle{color:#959188;font:9px var(--mono)}.cap-note{margin-top:9px;padding:8px 9px;border:1px solid #e2ce9c;background:#f8f0d9;color:#76561c;font-size:10px}.btn{padding:5px 8px;border:1px solid #bebab0;border-radius:4px;background:#fff;font:600 10px inherit}
#detail-head{display:none}#drawer-toggle,#detail-close{min-width:42px;height:34px;border:1px solid #bebab0;border-radius:4px;background:#fff}.btn:focus-visible,.op-btn:focus-visible,.mode-tabs button:focus-visible,select.sess:focus-visible,svg#tree .node:focus-visible rect{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:860px){body{grid-template-rows:56px minmax(0,1fr) 28px}header{grid-template-columns:auto 1fr auto;padding:0 11px;gap:7px}.kicker,.stat:nth-of-type(n+5){display:none}.stats{justify-content:flex-end}.stat{padding-inline:6px}.brand{gap:6px}select.sess{width:112px}main{display:block}#map-pane{height:100%}#detail-pane{position:fixed;inset:auto 0 0;z-index:20;width:100%;max-height:76vh;border:0;border-top:1px solid #bdb9af;padding:9px 13px max(18px,env(safe-area-inset-bottom));box-shadow:0 -12px 34px rgba(29,29,27,.18);transform:translateY(calc(100% - 43px));transition:transform .2s ease-out}#detail-pane.drawer-open{transform:translateY(0)}#detail-head{position:sticky;top:-9px;z-index:3;display:flex;align-items:center;gap:8px;padding-bottom:8px;background:#fff}.dh-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.operator{margin-inline:-13px;padding-inline:13px}footer span:last-child{display:none}}
@media (max-width:639px){select.sess,.operator textarea,.mode-tabs button,.op-btn{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header><div class="brand"><span class="kicker">Conversation graph</span><h1>Agent MCP</h1></div><div class="stats"><span class="stat run"><span class="lbl">运行</span><b id="st-run">0</b></span><span class="stat queued"><span class="lbl">排队</span><b id="st-queued">0</b></span><span class="stat done"><span class="lbl">完成</span><b id="st-done">0</b></span><span class="stat fail"><span class="lbl">异常</span><b id="st-fail">0</b></span><span class="stat"><span class="lbl">Token</span><b id="st-tok">0</b></span><span class="stat"><span class="lbl">Cost</span><b id="st-cost">$0</b></span></div><select id="sess" class="sess" title="会话切换"><option value="all">全部会话</option></select><span id="st-models" hidden></span></header>
<main><section id="map-pane"><div id="map-hint">每次用户输入生成一个节点，向右连接本轮 agent，再发散到子代理 · 画布仅左右移动</div><div id="map"><div class="empty">加载中…</div></div></section><aside id="detail-pane"><div class="empty">选择 agent 节点查看详情</div></aside></main>
<footer><span class="dot" id="sse-dot"></span><span id="sse-txt">连接中…</span><span class="live-b buf" id="live-tag">BUFFERED</span><span>seq <span id="sseq">0</span></span><span id="snap-state"></span><span style="margin-left:auto">本机回环 · 用量由 CLI 解析</span></footer>
<script>
"use strict";
const EVENT_TYPES=["agent.spawned","agent.user_turn","agent.running","agent.message","agent.message_delta","agent.tool_use","agent.tool_result","agent.usage","agent.thread_message_sent","agent.thread_message_received","agent.idle","agent.terminated","agent.error","agent.cancelled"];
const SEQ_KEY="amcp_last_seq",SEL_KEY="amcp_sel",MSG_PAGE=40;
const S={session:"all",agents:new Map(),children:new Map(),eventLog:new Map(),usage:new Map(),deltas:new Map(),curTool:new Map(),selected:null,lastSeq:0,seen:new Set(),sessions:new Set(["all"]),sse:"connecting",msgsShown:MSG_PAGE,snapTimer:null,snapErr:"",token:"",opMode:"steer",opBusy:false,opFeedback:""};
const $=id=>document.getElementById(id),NS="http:"+"//www.w3.org/2000/svg";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>Number.isFinite(Number(v))?Number(v):0;
function fmtTok(n){n=num(n);return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":String(Math.round(n));}
function fmtTime(v){if(!v)return"—";const d=new Date(v);return isNaN(d)?v:d.toLocaleString();}
function shortLabel(v,n=24){const s=String(v||"").replace(/\s+/g," ").trim();return s.length>n?s.slice(0,n-1)+"…":s;}
function shortName(v){const p=String(v||"").split("/").filter(Boolean),s=p.length?p[p.length-1]:String(v||"");return shortLabel(s,22);}
function cliColor(cli,isRoot){if(isRoot)return"var(--accent)";return cli==="grok"?"var(--grok)":cli==="opencode"?"var(--opencode)":cli==="omp"?"var(--omp)":cli==="atomcode"?"var(--atomcode)":"var(--claude)";}
function statusColor(s){return s==="running"?"var(--accent)":s==="terminated"?"var(--green)":s==="error"?"var(--red)":"var(--gray)";}
function statusLabel(s){return s==="running"?"运行中":s==="terminated"?"完成":s==="queued"?"排队":s==="error"?"失败":s==="cancelled"?"已取消":s==="incomplete"?"超时":s||"—";}
function loadConfig(){const params=new URLSearchParams(location.hash.slice(1));S.token=params.get("token")||"";if(S.token){history.replaceState(null,"",location.pathname+location.search);S.opFeedback="控制授权已就绪";}else S.opFeedback="控制授权不可用，页面保持只读";}
async function apiPost(path,body){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Auth-Token":S.token},body:JSON.stringify(body)});const d=await r.json().catch(()=>({error:"响应不是 JSON"}));if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d;}
function clearState(){S.agents=new Map();S.children=new Map();S.eventLog=new Map();S.usage=new Map();S.deltas=new Map();S.curTool=new Map();S.seen=new Set();S.lastSeq=0;S.msgsShown=MSG_PAGE;}
async function loadSnapshot(reset){if(reset)clearState();const q=S.session!=="all"?"?session_id="+encodeURIComponent(S.session):"";try{const r=await fetch("/api/snapshot"+q);if(!r.ok){S.snapErr="快照不可用 ("+r.status+")";scheduleRender();return;}applySnapshot(await r.json());S.snapErr="";}catch(e){S.snapErr="无法连接 daemon";scheduleRender();}}
function applySnapshot(s){const kept=[...S.eventLog.entries()].filter(([seq])=>seq>(s.last_seq||0));S.eventLog.clear();for(const e of s.events||[])if(typeof e.seq==="number")S.eventLog.set(e.seq,e);for(const [seq,e]of kept)S.eventLog.set(seq,e);S.seen=new Set(S.eventLog.keys());S.lastSeq=s.last_seq||0;S.agents=new Map((s.agents||[]).map(a=>[a.id,a]));rebuildChildren();for(const u of((s.usage||{}).per_agent)||[])S.usage.set(u.agent_id,u);S.sessions=new Set(["all"]);for(const a of S.agents.values())S.sessions.add(a.session_id||"unknown");if(!S.agents.has(S.selected))S.selected=firstAgent();localStorage.setItem(SEQ_KEY,String(S.lastSeq));scheduleRender();}
function rebuildChildren(){S.children=new Map();for(const a of S.agents.values())if(a.parent_id!=null){if(!S.children.has(a.parent_id))S.children.set(a.parent_id,[]);S.children.get(a.parent_id).push(a.id);}}
function firstAgent(){const a=[...S.agents.keys()].sort((x,y)=>x-y);return a.length?a[0]:null;}
function scheduleSnapshot(){if(S.snapTimer)return;S.snapTimer=setTimeout(()=>{S.snapTimer=null;loadSnapshot(false);},400);}
function connect(){const last=localStorage.getItem(SEQ_KEY),es=new EventSource("/events"+(last?"?last_seq="+last:""));es.onopen=()=>{S.sse="connected";scheduleRender();};es.onerror=()=>{S.sse="reconnecting";scheduleRender();};for(const t of EVENT_TYPES)es.addEventListener(t,e=>onEvent(t,e));}
function onEvent(type,ev){let data;try{data=JSON.parse(ev.data);}catch(e){return;}const seq=ev.lastEventId?parseInt(ev.lastEventId,10):null,payload=data.payload||{},aid=data.agent_id==null?null:Number(data.agent_id);if(seq!=null&&!isNaN(seq)){if(S.seen.has(seq))return;S.seen.add(seq);S.eventLog.set(seq,data);if(seq>S.lastSeq){S.lastSeq=seq;localStorage.setItem(SEQ_KEY,String(seq));}}if(type==="agent.spawned"&&!S.agents.has(aid))scheduleSnapshot();else if(["agent.running","agent.error","agent.cancelled"].includes(type)&&S.agents.has(aid)){const a=S.agents.get(aid);a.status=type.slice(6);if(payload.stop_reason)a.stop_reason=payload.stop_reason;}else if(type==="agent.terminated"&&S.agents.has(aid)){const a=S.agents.get(aid);a.status=payload.stop_reason==="timeout"?"incomplete":"terminated";a.stop_reason=payload.stop_reason;}else if(type==="agent.message"&&aid!=null)S.deltas.delete(aid);else if(type==="agent.message_delta"&&aid!=null)S.deltas.set(aid,(S.deltas.get(aid)||"")+String(payload.delta||""));else if(type==="agent.tool_use"&&aid!=null)S.curTool.set(aid,payload);else if(type==="agent.usage"&&aid!=null)S.usage.set(aid,payload);scheduleRender();}
let raf=null;function scheduleRender(){if(raf)return;raf=requestAnimationFrame(()=>{raf=null;renderAll();});}function renderAll(){renderHeader();renderTree();renderDetail();renderFooter();}
function renderHeader(){const sel=$("sess"),current=sel.value;sel.innerHTML="";for(const s of[...S.sessions].sort()){const o=document.createElement("option");o.value=s;o.textContent=s==="all"?"全部会话":s;sel.appendChild(o);}sel.value=S.sessions.has(current)?current:"all";let run=0,q=0,done=0,fail=0,tok=0,cost=0;for(const a of S.agents.values()){a.status==="running"?run++:a.status==="queued"?q++:a.status==="terminated"?done++:fail++;const u=S.usage.get(a.id);if(u){tok+=num(u.input_tokens)+num(u.output_tokens)+num(u.cache_creation)+num(u.cache_read);cost+=num(u.cost_usd);}}$("st-run").textContent=run;$("st-queued").textContent=q;$("st-done").textContent=done;$("st-fail").textContent=fail;$("st-tok").textContent=fmtTok(tok);$("st-cost").textContent="$"+cost.toFixed(4);}
const NODE_W=176,NODE_H=58,X_STEP=226,MG=18;
function userTurns(aid){return [...S.eventLog.values()].filter(e=>e.agent_id===aid&&e.type==="agent.user_turn").sort((a,b)=>(a.seq||0)-(b.seq||0));}
function buildGraph(){const nodes=new Map(),edges=[],lastRun=new Map();for(const a of [...S.agents.values()].sort((x,y)=>x.id-y.id)){const sid=a.session_id||"unknown",skey="s:"+sid;if(!nodes.has(skey))nodes.set(skey,{key:skey,type:"session",label:"会话 "+shortLabel(sid,17)});const turns=userTurns(a.id),list=turns.length?turns:[{seq:"legacy",payload:{text:a.task_name||"派发任务",kind:"spawn"}}];let previous=null;for(let i=0;i<list.length;i++){const turn=list[i],suffix=String(turn.seq||i),tkey=`t:${a.id}:${suffix}`,rkey=`r:${a.id}:${suffix}`;nodes.set(tkey,{key:tkey,type:"turn",agentId:a.id,label:String(turn.payload?.text||"用户输入"),kind:turn.payload?.kind||"spawn"});nodes.set(rkey,{key:rkey,type:"agent",agent:a});let from=previous;if(!from&&a.parent_id!=null)from=lastRun.get(a.parent_id);if(!from)from=skey;edges.push([from,tkey],[tkey,rkey]);previous=rkey;}lastRun.set(a.id,previous);}return{nodes,edges};}
function layoutGraph(g){const incoming=new Map();for(const k of g.nodes.keys())incoming.set(k,[]);for(const [f,t]of g.edges)if(g.nodes.has(f)&&g.nodes.has(t))incoming.get(t).push(f);const depth=new Map(),visit=k=>{if(depth.has(k))return depth.get(k);const ins=incoming.get(k)||[],d=ins.length?Math.max(...ins.map(visit))+1:0;depth.set(k,d);return d;};for(const k of g.nodes.keys())visit(k);const cols=new Map();for(const [k,d]of depth){if(!cols.has(d))cols.set(d,[]);cols.get(d).push(k);}const H=Math.max(($('map-pane').clientHeight||620)-70,220),maxRows=Math.max(1,Math.floor((H-MG)/(NODE_H+MG))),pos=new Map(),columnGroups=new Map();let visualCol=0;for(const [d,keys]of [...cols].sort((a,b)=>a[0]-b[0])){keys.sort();const groups=[];for(let i=0;i<keys.length;i+=maxRows)groups.push(keys.slice(i,i+maxRows));columnGroups.set(d,groups);for(const group of groups){const gap=Math.max(MG,(H-group.length*NODE_H)/(group.length+1));group.forEach((k,i)=>pos.set(k,{x:MG+visualCol*X_STEP,y:gap*(i+1)+NODE_H*i}));visualCol++;}}return{pos,width:Math.max(MG+visualCol*X_STEP,$("map-pane").clientWidth),height:H,columnGroups,maxRows};}
function svgText(g,x,y,text,size,weight,color){const t=document.createElementNS(NS,"text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("font-size",size);if(weight)t.setAttribute("font-weight",weight);t.setAttribute("fill",color);t.textContent=text;g.appendChild(t);}
function drawEdge(svg,pos,f,t){const p=pos.get(f),c=pos.get(t);if(!p||!c)return;const x1=p.x+NODE_W,y1=p.y+NODE_H/2,x2=c.x,y2=c.y+NODE_H/2,m=(x1+x2)/2,path=document.createElementNS(NS,"path");path.setAttribute("d",`M${x1} ${y1} H${m} V${y2} H${x2}`);path.setAttribute("stroke","#c6c1b7");path.setAttribute("stroke-width","1.2");path.setAttribute("fill","none");svg.appendChild(path);}
function currentActivity(a){const t=S.curTool.get(a.id);if(t)return"▸ "+String(t.name||"tool");const d=S.deltas.get(a.id);return d&&d.trim()?"▸ "+shortLabel(d.trim(),27):null;}
function renderNode(svg,pos,n){const p=pos.get(n.key);if(!p)return;const g=document.createElementNS(NS,"g"),r=document.createElementNS(NS,"rect");g.setAttribute("transform",`translate(${p.x},${p.y})`);r.setAttribute("width",NODE_W);r.setAttribute("height",NODE_H);r.setAttribute("rx",7);if(n.type==="session"){g.setAttribute("class","node sroot");r.setAttribute("fill","#1d1d1b");r.setAttribute("stroke","#1d1d1b");g.appendChild(r);svgText(g,12,25,n.label,"12","700","#fff");svgText(g,12,42,"conversation","9",null,"#aaa69d");}else if(n.type==="turn"){g.setAttribute("class","node turn");g.setAttribute("data-aid",n.agentId);g.setAttribute("tabindex","0");g.setAttribute("role","button");r.setAttribute("fill","var(--soft)");r.setAttribute("stroke","var(--accent)");g.appendChild(r);svgText(g,12,19,"USER · "+String(n.kind||"TURN").toUpperCase(),"9","700","var(--accent)");svgText(g,12,40,shortLabel(n.label,28),"11","600","#292826");g.addEventListener("click",()=>select(n.agentId));g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(n.agentId);}});}else{const a=n.agent,gone=a.status==="terminated"||a.status==="cancelled"||a.status==="incomplete",sel=a.id===S.selected;g.setAttribute("class","node agent"+(sel?" selected":""));g.setAttribute("data-aid",a.id);g.setAttribute("tabindex","0");g.setAttribute("role","button");r.setAttribute("fill",sel?"#f3f5f1":"#fff");r.setAttribute("stroke",sel?"var(--accent)":"#bbb6ad");g.appendChild(r);const c=document.createElementNS(NS,"circle");c.setAttribute("cx",12);c.setAttribute("cy",15);c.setAttribute("r",3.4);c.setAttribute("fill",a.status==="running"?"var(--ok)":a.status==="queued"?"var(--amber)":gone?"#918c82":"#918c82");g.appendChild(c);svgText(g,21,19,shortLabel(a.task_name,27),"11","700","#292826");svgText(g,12,36,String(a.cli||"").toUpperCase()+" · "+a.status,"9",null,"#77736c");svgText(g,12,51,currentActivity(a)||shortLabel(a.last_message||"",27)||"等待事件…","9",null,"#8b877f");g.addEventListener("click",()=>select(a.id));g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(a.id);}});}svg.appendChild(g);}
function renderTree(){const pane=$("map"),g=buildGraph();if(!g.nodes.size){pane.innerHTML='<div class="empty">暂无对话节点 · 用户输入后将在这里向右展开</div>';return;}const l=layoutGraph(g),svg=document.createElementNS(NS,"svg");svg.setAttribute("id","tree");svg.setAttribute("width",l.width);svg.setAttribute("height",l.height);for(const e of g.edges)drawEdge(svg,l.pos,...e);for(const n of g.nodes.values())renderNode(svg,l.pos,n);pane.innerHTML="";pane.appendChild(svg);}
function messagesOf(id){return [...S.eventLog.values()].filter(e=>e.agent_id===id&&e.type==="agent.message").sort((a,b)=>a.seq-b.seq);}function usageSeries(id){return [...S.eventLog.values()].filter(e=>e.agent_id===id&&e.type==="agent.usage").sort((a,b)=>a.seq-b.seq).map(e=>e.payload||{});}function tokenChart(id){const p=usageSeries(id);if(!p.length)return'<div class="empty">等待 usage 数据…</div>';const u=p[p.length-1];return'<table class="sum"><tr><td>Input</td><td>'+fmtTok(u.input_tokens)+'</td></tr><tr><td>Output</td><td>'+fmtTok(u.output_tokens)+'</td></tr><tr><td>Cache</td><td>'+fmtTok(num(u.cache_creation)+num(u.cache_read))+'</td></tr></table>';}
function payloadSummary(e){const p=e.payload||{};return e.type==="agent.message"?String(p.text||"").slice(0,55):e.type==="agent.user_turn"?String(p.text||"").slice(0,55):JSON.stringify(p).slice(0,70);}
function renderDetail(){const pane=$("detail-pane"),a=S.agents.get(S.selected),head=()=>'<div id="detail-head"><button id="drawer-toggle" type="button" aria-expanded="'+(pane.classList.contains("drawer-open")?"true":"false")+'">详情</button><span class="dh-name">'+esc(a?a.task_name:"")+'</span><button id="detail-close" type="button" aria-label="关闭详情">×</button></div>';if(!a){pane.innerHTML=head()+'<div class="empty">选择 agent 节点查看详情</div>';return;}const msgs=messagesOf(a.id),shown=msgs.slice(-S.msgsShown),delta=S.deltas.get(a.id);let mh=shown.map(m=>'<div class="msg"><span class="seq">#'+m.seq+'</span>'+esc(m.payload?.text||"").slice(0,3000)+'</div>').join("");if(delta)mh+='<div class="msg delta">'+esc(delta).slice(-1000)+'</div>';if(!mh)mh='<div class="empty">暂无消息</div>';const evs=[...S.eventLog.values()].filter(e=>e.agent_id===a.id).sort((x,y)=>(y.seq||0)-(x.seq||0)).slice(0,14).map(e=>'<div class="ev"><span class="seq">#'+(e.seq||"—")+'</span><span class="tp">'+esc(e.type)+'</span><span class="py">'+esc(payloadSummary(e))+'</span></div>').join("");const running=a.status==="running",label=S.opMode==="steer"?"中途插话":"继续会话",hint=S.opMode==="steer"?"终止当前 run 后在同一节点续接":"稳定 session id 的 CLI 自动恢复；AtomCode 将新开 one-shot";const op='<div class="operator"><div class="mode-tabs"><button type="button" data-mode="steer" class="'+(S.opMode==="steer"?"active":"")+'">中途插话</button><button type="button" data-mode="followup" class="'+(S.opMode==="followup"?"active":"")+'">继续会话</button></div><label for="op-message">'+label+'</label><textarea id="op-message" maxlength="20000" placeholder="输入新的方向或下一步任务"></textarea><div class="op-actions"><button id="op-send" class="op-btn primary" type="button" '+(S.opBusy||(!running&&S.opMode==="steer")?"disabled":"")+'>'+label+'</button><button id="op-stop" class="op-btn danger" type="button" '+(S.opBusy||!running?"disabled":"")+'>停止</button><span class="op-note">'+esc(hint)+'</span></div><div class="op-feedback'+(S.opFeedback.startsWith("失败")?" error":"")+'">'+esc(S.opFeedback)+'</div><div class="task-handle">agent:'+a.id+'</div></div>';pane.innerHTML=head()+'<h2 class="aname">'+esc(shortName(a.task_name))+'<span class="cli-badge" style="background:'+cliColor(a.cli,a.parent_id==null)+'">'+esc(a.cli)+'</span></h2><div class="subtitle">'+esc(a.task_name)+'</div>'+op+'<div class="dk">状态</div><table class="sum"><tr><td>状态</td><td>'+statusLabel(a.status)+(a.stop_reason?' · '+esc(a.stop_reason):'')+'</td></tr><tr><td>模型</td><td>'+esc(a.model||"—")+'</td></tr><tr><td>更新</td><td>'+esc(fmtTime(a.updated_at))+'</td></tr></table><div class="dk">用量</div>'+tokenChart(a.id)+'<div class="dk">消息</div><div class="msgs">'+mh+'</div><div class="dk">事件</div><div class="events">'+evs+'</div>'+(a.cli==="atomcode"?'<div class="cap-note"><b>AtomCode</b>：one-shot；verbose token usage 已解析，无 stable resume。</div>':'');}
function renderFooter(){const dot=$("sse-dot"),txt=$("sse-txt"),tag=$("live-tag");if(S.sse==="connected"){dot.className="dot ok";txt.textContent="SSE 已连接 实时数据";tag.className="live-b live";tag.textContent="LIVE";}else if(S.sse==="reconnecting"){dot.className="dot bad";txt.textContent="SSE 断线重连中 当前展示快照缓存（非实时）";tag.className="live-b buf";tag.textContent="BUFFERED";}else{txt.textContent="连接中… 当前展示快照数据";}$("sseq").textContent=S.lastSeq;$("snap-state").textContent=S.snapErr;}
function isNarrow(){return matchMedia("(max-width: 860px)").matches;}function selectAgent(id){S.selected=id;S.msgsShown=MSG_PAGE;localStorage.setItem(SEL_KEY,String(id));if(isNarrow())$("detail-pane").classList.add("drawer-open");scheduleRender();}
document.addEventListener("DOMContentLoaded",()=>{const saved=parseInt(localStorage.getItem(SEL_KEY),10);if(Number.isFinite(saved)&&saved>0)S.selected=saved;$("map-pane").addEventListener("click",e=>{const g=e.target.closest?.("[data-aid]");if(g)selectAgent(Number(g.dataset.aid));});$("map-pane").addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const g=e.target.closest?.("[data-aid]");if(g){e.preventDefault();selectAgent(Number(g.dataset.aid));}});$("detail-pane").addEventListener("click",async e=>{if(e.target.id==="detail-close"){$("detail-pane").classList.remove("drawer-open");scheduleRender();return;}if(e.target.id==="drawer-toggle"){$("detail-pane").classList.toggle("drawer-open");scheduleRender();return;}if(e.target.dataset?.mode){S.opMode=e.target.dataset.mode;S.opFeedback="";scheduleRender();return;}const a=S.agents.get(S.selected);if(!a)return;if(e.target.id==="op-stop"){S.opBusy=true;scheduleRender();try{await apiPost("/api/agents/interrupt",{agent_id:a.id,session_id:a.session_id});S.opFeedback="已发送停止请求";}catch(err){S.opFeedback="失败："+err.message;}finally{S.opBusy=false;loadSnapshot(false);}return;}if(e.target.id==="op-send"){const message=($("op-message")?.value||"").trim();if(!message){S.opFeedback="失败：请输入新的方向或下一步任务";scheduleRender();return;}S.opBusy=true;scheduleRender();const path=S.opMode==="steer"?"/api/agents/steer":"/api/agents/followup",body=S.opMode==="steer"?{agent_id:a.id,message,session_id:a.session_id}:{agent_id:a.id,prompt:message,session_id:a.session_id};try{const r=await apiPost(path,body);S.opFeedback=(r.resumed_session_id?"已恢复原会话":"已创建下一 turn")+(r.status?" · "+r.status:"");}catch(err){S.opFeedback="失败："+err.message;}finally{S.opBusy=false;loadSnapshot(false);}}});document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("detail-pane").classList.remove("drawer-open");scheduleRender();}});$("sess").addEventListener("change",e=>{S.session=e.target.value;loadSnapshot(true);});renderAll();loadConfig();loadSnapshot(fal
