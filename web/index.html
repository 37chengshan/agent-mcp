<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='32' height='32' rx='8' fill='%23C0503A'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='white'%3EA%3C/text%3E%3C/svg%3E">
<title>Agent MCP · 控制台</title>
<style>
/* ============================================================
 * Agent MCP 控制台 v4 — Archify 风格节点 + 三栏可收起布局
 * 左：会话栏  中：对话图 / 会话总览  右：Agent 详情
 * ============================================================ */
:root{
  --bg:#F7F5F0; --bg-deep:#EFECE4; --card:#FFFFFF; --ink:#2E2A22; --ink-soft:#6E675A;
  --accent:#C0503A; --accent-soft:#F6E3DB; --accent-deep:#9C3D2C;
  --line:#E7E2D8; --line-soft:#F0ECE3;
  --green:#3E7A56; --green-soft:#E4F0E8; --red:#B13E33; --red-soft:#F7E4E1;
  --amber:#9A7B2F; --amber-soft:#F5EDD8; --gray:#8B867A; --gray-soft:#F1EFE9;
  --cyan:#2F6F7E; --cyan-soft:#E3F0F3; --purple:#5A54A3; --purple-soft:#ECEBF6;
  --mask:#FFFFFF;
  --radius:12px; --radius-sm:8px;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --serif:Georgia,"Songti SC",serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --rail-l:220px; --rail-r:340px;
  --shadow:0 1px 2px rgba(46,42,34,.05),0 4px 14px rgba(46,42,34,.05);
  --shadow-pop:0 2px 6px rgba(46,42,34,.08),0 14px 40px rgba(46,42,34,.12);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1115; --bg-deep:#0A0C10; --card:#171A21; --ink:#E8ECF4; --ink-soft:#9AA3B2;
  --accent:#E07A62; --accent-soft:#3A221C; --accent-deep:#F0A08C;
  --line:#2A2F3A; --line-soft:#1E232C;
  --green:#5FBF8A; --green-soft:#1A2E24; --red:#E07A70; --red-soft:#331C1A;
  --amber:#D4B05A; --amber-soft:#2E2814; --gray:#7E8796; --gray-soft:#1E232C;
  --cyan:#5BBCD0; --cyan-soft:#142830; --purple:#9A90E0; --purple-soft:#1E1A30;
  --mask:#171A21;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3);
  --shadow-pop:0 2px 8px rgba(0,0,0,.45),0 18px 52px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0F1115; --bg-deep:#0A0C10; --card:#171A21; --ink:#E8ECF4; --ink-soft:#9AA3B2;
  --accent:#E07A62; --accent-soft:#3A221C; --accent-deep:#F0A08C;
  --line:#2A2F3A; --line-soft:#1E232C;
  --green:#5FBF8A; --green-soft:#1A2E24; --red:#E07A70; --red-soft:#331C1A;
  --amber:#D4B05A; --amber-soft:#2E2814; --gray:#7E8796; --gray-soft:#1E232C;
  --cyan:#5BBCD0; --cyan-soft:#142830; --purple:#9A90E0; --purple-soft:#1E1A30;
  --mask:#171A21;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3);
  --shadow-pop:0 2px 8px rgba(0,0,0,.45),0 18px 52px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#F7F5F0; --bg-deep:#EFECE4; --card:#FFFFFF; --ink:#2E2A22; --ink-soft:#6E675A;
  --accent:#C0503A; --accent-soft:#F6E3DB; --accent-deep:#9C3D2C;
  --line:#E7E2D8; --line-soft:#F0ECE3;
  --green:#3E7A56; --green-soft:#E4F0E8; --red:#B13E33; --red-soft:#F7E4E1;
  --amber:#9A7B2F; --amber-soft:#F5EDD8; --gray:#8B867A; --gray-soft:#F1EFE9;
  --cyan:#2F6F7E; --cyan-soft:#E3F0F3; --purple:#5A54A3; --purple-soft:#ECEBF6;
  --mask:#FFFFFF;
}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  display:grid;
  grid-template-rows:56px minmax(0,1fr) 30px;
  grid-template-areas:"hd" "bd" "ft";
  background:var(--bg);color:var(--ink);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
header{
  grid-area:hd;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--card);border-bottom:1px solid var(--line);z-index:5;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;
  font:700 12px/1 var(--mono);flex:0 0 auto;
}
.brand h1{margin:0;font:700 15px/1.1 var(--serif);letter-spacing:-.02em}
.kicker{font:700 8px/1 var(--mono);letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.stats{display:flex;gap:4px;margin-left:8px;min-width:0;overflow:hidden}
.stat{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;white-space:nowrap;cursor:pointer}
.stat:hover{background:var(--gray-soft)}
.stat .lbl{font:700 8px/1 var(--mono);color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.stat b{font:700 13px/1 var(--serif);font-variant-numeric:tabular-nums}
.stat.run b{color:var(--accent)}.stat.done b{color:var(--green)}.stat.fail b{color:var(--red)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{
  height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink);font:600 11px inherit;cursor:pointer;
}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hbtn.primary{border-color:var(--accent);color:var(--accent)}
.hbtn.primary:hover{background:var(--accent);color:#fff}

#bd{
  grid-area:bd;display:flex;min-height:0;overflow:hidden;
}
/* ---- 左：会话栏 ---- */
#rail-l{
  flex:0 0 var(--rail-l);width:var(--rail-l);min-width:0;
  display:flex;flex-direction:column;background:var(--card);
  border-right:1px solid var(--line);transition:width .2s var(--ease),flex-basis .2s var(--ease);
}
#rail-l.collapsed{flex-basis:0;width:0;border-right:0;overflow:hidden}
.rail-hd{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);
  font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
}
.rail-btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;
  font:700 12px/1 inherit;padding:4px 7px;border-radius:6px;
}
.rail-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
#sess-list{flex:1;overflow-y:auto;padding:8px}
.sess-row{
  width:100%;text-align:left;border:1px solid transparent;border-radius:10px;
  background:transparent;color:var(--ink);padding:8px 10px;margin-bottom:4px;cursor:pointer;
  transition:background .15s var(--ease),border-color .15s var(--ease);
}
.sess-row:hover{background:var(--gray-soft)}
.sess-row.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.sess-row .sr-name{
  font:650 12px/1.3 inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sess-row .sr-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.sr-chip{font:700 8px/1 var(--mono);padding:2px 6px;border-radius:999px;background:var(--gray-soft);color:var(--ink-soft)}
.sr-chip.run{background:var(--accent-soft);color:var(--accent)}
.sr-chip.ok{background:var(--green-soft);color:var(--green)}
.sr-chip.err{background:var(--red-soft);color:var(--red)}

/* ---- 中：图区 ---- */
#center{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
#map-hint{
  flex:0 0 36px;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-bottom:1px solid var(--line);color:var(--ink-soft);font-size:11px;
  background:color-mix(in srgb,var(--bg) 90%,var(--card));
}
#map-hint .spacer{flex:1}
#graph-scroll{flex:1;position:relative;overflow:hidden;cursor:grab}
#graph-scroll.grabbing{cursor:grabbing}
#graph-scroll.cards-mode{cursor:default;overflow-y:auto;padding:18px}
#graph-scroll.cards-mode #graph-viewport{display:none}
#sess-cards{display:none}
#graph-scroll.cards-mode #sess-cards{display:block}
#sess-cards[hidden]{display:none!important}
#graph-viewport{position:absolute;left:0;top:0;transform-origin:0 0}
#graph-edges,#graph-nodes{position:absolute;left:0;top:0}
#graph-edges{overflow:visible}
#graph-edges path{
  fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;
}
#graph-edges path.flow{
  stroke-dasharray:6 10;
  animation:edgeFlow 1.1s linear infinite;
}
#graph-edges path.on{stroke:var(--accent);stroke-width:2}
#graph-edges path.on.flow{stroke-dasharray:5 9;animation-duration:.7s}
@keyframes edgeFlow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){
  #graph-edges path.flow{animation:none;stroke-dasharray:none}
  .node.agent.st-running::after{animation:none;opacity:.6}
  .node,.sess-card,.sess-row,.agent-chip{transition:none!important;animation:none!important}
  .cur-act .ico{animation:none!important;opacity:.7}
}
#graph-nodes{pointer-events:none}
#graph-nodes .node{pointer-events:auto;cursor:grab}
#graph-nodes .node.dragging{cursor:grabbing;z-index:5;box-shadow:var(--shadow-pop)}
.graph-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-soft);font-size:12px}
.graph-empty[hidden]{display:none}

/* Archify 风格节点：扁平填充 + 细描边 + 语义色 */
.node{
  position:absolute;left:0;top:0;border-radius:6px;
  transition:box-shadow .16s var(--ease),opacity .2s ease;
  user-select:none;
}
.node.session{
  width:200px;height:48px;padding:0 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;
  background:var(--amber-soft);border:1.5px solid var(--amber);color:var(--ink);cursor:default;
}
.node.turn{
  width:220px;height:36px;padding:0 12px;display:flex;align-items:center;
  background:var(--gray-soft);border:1.5px solid var(--gray);color:var(--ink-soft);
  font:600 11px/1.2 inherit;
}
.node.agent{
  width:240px;height:56px;padding:8px 12px;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1.5px solid var(--line);
}
.node.agent.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node.agent.st-running{border-color:var(--accent);background:var(--accent-soft)}
.node.agent.st-terminated{border-color:var(--green);background:var(--green-soft)}
.node.agent.st-error,.node.agent.st-cancelled{border-color:var(--red);background:var(--red-soft)}
.node.agent.st-incomplete,.node.agent.st-needs_advisor{border-color:var(--amber);background:var(--amber-soft)}
.node.agent.st-queued{border-color:var(--cyan);background:var(--cyan-soft)}
.node.agent.st-running::after{
  content:"";position:absolute;inset:-3px;border-radius:8px;border:1.5px solid var(--accent);
  animation:nodePulse 1.8s ease-in-out infinite;pointer-events:none;
}
.ndot{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.nmain{min-width:0;flex:1}
.ntitle{font:650 11.5px/1.25 inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.nsub{font:600 9px/1.2 var(--mono);color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.node.session .ntitle{font:700 12px/1.2 var(--serif)}
.node.session .nsub{font:700 8px/1 var(--mono);letter-spacing:.12em;color:var(--amber)}
.node.turn .ntitle{font:600 11px/1.2 inherit;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbadges{position:absolute;top:-7px;right:6px;display:flex;gap:3px}
.nbadges .badge{font:700 8px/1 var(--mono);padding:2px 6px;border-radius:999px;border:1px solid;background:var(--card)}
.badge.stuck,.badge.timeout{border-color:var(--red);color:var(--red)}
.badge.silent{border-color:var(--gray);color:var(--gray)}
.badge.fail{border-color:var(--amber);color:var(--amber)}
@keyframes nodePulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes nodeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.node.fresh{animation:nodeIn .28s var(--ease) backwards}

/* 会话总览卡片（Archify 扁平卡） */
/* 会话总览卡片 */
.sess-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sess-card{
  border:1.5px solid var(--line);border-radius:6px;background:var(--card);
  padding:14px 14px 12px;cursor:pointer;
  transition:border-color .15s var(--ease),transform .15s var(--ease),box-shadow .15s var(--ease);
}
.sess-card:hover{border-color:var(--amber);transform:translateY(-1px);box-shadow:var(--shadow)}
.sess-card .sc-name{font:700 13px/1.3 var(--serif);margin-bottom:8px;word-break:break-all}
.sess-card .sc-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.sess-card .sc-tasks{font-size:11px;color:var(--ink-soft);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sess-card .sc-time{margin-top:8px;font:9px var(--mono);color:var(--ink-soft)}
/* 会话文件夹 + 顶栏 agent 切换 */
.folder{margin-bottom:6px}
.folder-hd{
  width:100%;display:flex;align-items:center;gap:6px;padding:7px 8px;border:0;border-radius:8px;
  background:transparent;color:var(--ink-soft);cursor:pointer;text-align:left;
  font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
}
.folder-hd:hover{background:var(--gray-soft);color:var(--ink)}
.folder-hd .fx{width:12px;text-align:center;opacity:.7}
.folder-hd .fc{margin-left:auto;font:700 9px var(--mono);opacity:.7}
.folder-body{padding-left:4px}
.folder.collapsed .folder-body{display:none}
.agent-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 12px;
  border-bottom:1px solid var(--line);background:var(--card);overflow-x:auto;
}
.agent-bar .ab-label{font:700 9px var(--mono);color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;flex:0 0 auto}
.agent-chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
  border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);
  font:600 11px inherit;cursor:pointer;white-space:nowrap;
  transition:border-color .15s var(--ease),background .15s var(--ease);
}
.agent-chip:hover{border-color:var(--accent)}
.agent-chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.agent-chip .ac-dot{width:7px;height:7px;border-radius:50%}
.agent-chip .ac-cli{font:700 8px var(--mono);color:var(--ink-soft);text-transform:uppercase}
.agent-more{
  flex:0 0 auto;height:28px;max-width:140px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);color:var(--ink-soft);font:600 11px inherit;padding:0 8px;cursor:pointer;
}
.agent-more:hover{border-color:var(--accent);color:var(--accent)}

/* ---- 右：详情栏 ---- */
#rail-r{
  flex:0 0 var(--rail-r);width:var(--rail-r);min-width:0;
  display:flex;flex-direction:column;background:var(--card);
  border-left:1px solid var(--line);transition:width .2s var(--ease),flex-basis .2s var(--ease);
}
#rail-r.collapsed{flex-basis:0;width:0;border-left:0;overflow:hidden}
#detail-pane{flex:1;overflow-y:auto;padding:14px 16px 28px}
.dk{
  display:flex;align-items:center;gap:8px;margin:18px 0 8px;color:var(--ink-soft);
  font:700 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
}
.dk::after{content:"";height:1px;flex:1;background:var(--line)}
.dk:first-child{margin-top:0}
h2.aname{margin:0;font:700 16px/1.25 var(--serif);letter-spacing:-.02em;word-break:break-all}
.cli-badge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;color:#fff;font:700 8px/1 var(--mono);vertical-align:2px}
.subtitle{margin-top:6px;color:var(--ink-soft);font-size:11px;word-break:break-all}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.cur-act{padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:11px;border-radius:0 6px 6px 0}
.cur-act .ico{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;animation:breathe 1.6s ease-in-out infinite}
.cur-act .in{color:var(--ink-soft)}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:11px;white-space:pre-wrap;word-break:break-word}
.msg.delta{border-style:dashed;color:var(--ink-soft)}
.msg .seq{margin-right:5px;color:var(--ink-soft);font:9px var(--mono)}
.events{font-size:10px}
.ev{display:grid;grid-template-columns:32px 110px minmax(0,1fr);gap:6px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.ev .seq{color:var(--ink-soft);font-family:var(--mono)}
.ev .tp{font-weight:650;white-space:nowrap;color:var(--ink)}
.ev .py{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft)}
.ev .tp.tool,.ev .tp.use{color:var(--accent)}
.ev .tp.msg{color:var(--green)}
.ev .tp.err{color:var(--red)}
.ev .tp.term{color:var(--gray)}
.empty{padding:18px 0;text-align:center;color:var(--ink-soft);font-size:11px}
#search-\boxed{
  width:100%;margin-bottom:8px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;
  background:var(--bg);color:var(--ink);font:12px inherit;
}
#search-box:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.operator{margin:8px -16px 0;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg)}
.operator label{display:block;margin-bottom:6px;color:var(--ink-soft);font:700 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.operator textarea{
  width:100%;min-height:70px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
  resize:vertical;background:var(--card);color:var(--ink);font:12px/1.5 inherit;
}
.operator textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:8px;border-bottom:1px solid var(--line)}
.mode-tabs button{
  padding:6px;border:0;border-bottom:2px solid transparent;background:transparent;
  color:var(--ink-soft);font:650 10px inherit;cursor:pointer;
}
.mode-tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.op-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.op-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 11px inherit;cursor:pointer}
.op-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.op-btn.danger{border-color:var(--red);color:var(--red)}
.op-btn:disabled{opacity:.45;cursor:not-allowed}
.op-note{font-size:10px;color:var(--ink-soft)}
.op-feedback{margin-top:6px;font-size:11px;color:var(--green)}
.op-feedback.error{color:var(--red)}

#usage-panel{
  position:absolute;top:44px;right:12px;z-index:20;width:340px;max-height:65vh;overflow-y:auto;
  background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;
}
#usage-panel[hidden]{display:none}
.upa{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.upa .nm{font-weight:600;font-size:11px}
.upa .bars{display:flex;height:10px;border-radius:3px;overflow:hidden;margin-top:4px;background:var(--gray-soft)}
.upa .bars span{display:inline-block}
.bi{background:var(--green)}.bo{background:var(--accent)}.bc{background:var(--amber)}
.upa .lg{display:flex;gap:8px;font:9px var(--mono);color:var(--ink-soft);margin-top:3px}

<body>
<header>
  <div class="brand">
    <span class="brand-mark">A</span>
    <span><span class="kicker">Agent Control Plane</span><h1>Agent MCP</h1></span>
  </div>
  <div class="stats" id="stats-bar">
    <span class="stat run"><span class="lbl">运行</span><b id="st-run">0</b></span>
    <span class="stat"><span class="lbl">排队</span><b id="st-queued">0</b></span>
    <span class="stat done"><span class="lbl">完成</span><b id="st-done">0</b></span>
    <span class="stat fail"><span class="lbl">异常</span><b id="st-fail">0</b></span>
    <span class="stat"><span class="lbl">Token</span><b id="st-tok">0</b></span>

  <div class="hdr-right">
    <button class="hbtn" id="theme-btn" type="button" title="切换明暗">☾</button>
    <button class="hbtn" id="usage-btn" type="button" title="Token 用量">用量</button>
    <button class="hbtn primary" id="dashboard-btn" type="button">仪表盘</button>

</header>

<div id="bd">
  <aside id="rail-l">
    <div class="rail-hd">
      <button type="button" id="toggle-l" class="rail-btn" title="收起/展开会话栏">☰</button>
      <span>会话</span>
    </div>
    <div id="sess-list"></div>
  </aside>

  <section id="center">
    <div class="agent-bar" id="agent-bar">

  <span id="snap-state"></span>
  <span class="foot-right" id="foot-ver">agent-mcp</span>
</footer>

<script>
"use strict";
/* ============================================================
 * Agent MCP 控制台 — 会话栏 + Archify 节点 + 可收起双栏
 * ============================================================ */
const EVENT_TYPES=["agent.spawned","agent.user_turn","agent.running","agent.message","agent.message_delta","agent.tool_use","agent.tool_result","agent.usage","agent.thread_message_sent","agent.thread_message_received","agent.idle","agent.terminated","agent.error","agent.cancelled","agent.orphaned","agent.needs_advisor","agent.verify_failed","agent.verify_passed","agent.budget_downgrade","agent.ingest_failed","agent.audit_failed"];
const SEQ_KEY="amcp_last_seq",SEL_KEY="amcp_sel",MSG_PAGE=40;
const LS_RAIL_L="amcp_rail_l",LS_RAIL_R="amcp_rail_r",LS_THEME="am-theme",LS_FOLDER="amcp_folders";

const S={
  session:"__overview__",agents:new Map(),children:new Map(),eventLog:new Map(),
  usage:new Map(),deltas:new Map(),curTool:new Map(),selected:null,lastSeq:0,
  seen:new Set(),sessions:new Map(),sse:"connecting",sseEs:null,sseRetry:0,
  msgsShown:MSG_PAGE,snapTimer:null,snapErr:"",token:"",opMode:"steer",opBusy:false,opFeedback:"",
  fullRedrawTimer:null,lastGraph:null,nodeEls:new Map(),_fitted:false,
  pan:{x:0,y:0},zoom:1,drag:null,dragMoved:false,nodeDrag:null,
  nodePos:new Map(),lastLayout:null,folderOpen:new Map(),
  usageOpen:false,_searchVal:"",
};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>Number.isFinite(Number(v))?Number(v):0;
function fmtTok(n){n=num(n);return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":String(Math.round(n));}
function fmtTime(v){if(!v)return"—";const d=new Date(v);return isNaN(d)?v:d.toLocaleTimeString();}
function fmtWhen(v){
  if(!v)return"—";
  const d=new Date(v); if(isNaN(d))return String(v);
  const now=Date.now(),diff=now-d.getTime();
  if(diff<60e3)return"刚刚";
  if(diff<3600e3)return Math.floor(diff/60e3)+" 分钟前";
  if(diff<86400e3)return Math.floor(diff/3600e3)+" 小时前";
  return d.toLocaleDateString();
}
function shortLabel(v,n=24){const s=String(v||"").replace(/\s+/g," ").trim();return s.length>n?s.slice(0,n-1)+"…":s;}
function cliColor(cli){
  const c=String(cli||"").toLowerCase();
  return c==="grok"?"var(--amber)":c==="opencode"?"var(--green)":c==="omp"?"var(--purple)"
    :c==="atomcode"?"var(--cyan)":c==="codex"?"var(--green)":c==="claude"?"var(--accent)"
    :"var(--gray)";
}
function statusColor(s){
  return s==="running"?"var(--accent)":s==="terminated"?"var(--green)"
    :s==="error"||s==="cancelled"?"var(--red)"
    :s==="incomplete"||s==="needs_advisor"?"var(--amber)"
    :s==="queued"?"var(--cyan)":"var(--gray)";
}
function statusLabel(s){
  return s==="running"?"运行中":s==="terminated"?"完成":s==="queued"?"排队"
    :s==="error"?"失败":s==="cancelled"?"已取消":s==="incomplete"?"超时/失联"
    :s==="needs_advisor"?"需决策":s||"—";
}
function anomalyLabel(k){return{"stuck_loop":"卡循环","high_fail":"高失败","silent":"静默","timeout":"超时"}[k]||k;}

/* ---------- 主题 / 栏收起 ---------- */
function applyTheme(t){
  if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;
  else delete document.documentElement.dataset.theme;
  const btn=$("theme-btn"); if(btn)btn.textContent=currentTheme()==="dark"?"☀":"☾";
}
function currentTheme(){
  const t=document.documentElement.dataset.theme;
  if(t)return t;
  return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
}
function bindChrome(){
  $("theme-btn").addEventListener("click",()=>{
    const next=currentTheme()==="dark"?"light":"dark";
    localStorage.setItem(LS_THEME,next);applyTheme(next);
  });
  const saved=localStorage.getItem(LS_THEME);
  applyTheme(saved||null);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{
    if(!localStorage.getItem(LS_THEME))applyTheme(null);
  });
  const rl=$("rail-l"),rr=$("rail-r");
  const narrow=matchMedia("(max-width:960px)").matches;
  const savedL=localStorage.getItem(LS_RAIL_L);
  const savedR=localStorage.getItem(LS_RAIL_R);
  // 窄屏：左栏默认收起（除非用户显式展开过）；宽屏尊重上次选择
  if(savedL==="1"||(narrow&&savedL!=="0"))rl.classList.add("collapsed");
  if(savedR==="1")rr.classList.add("collapsed");
  // 单按钮：点一下在收起/展开之间切换
  $("toggle-l").onclick=()=>{
    rl.classList.toggle("collapsed");
    localStorage.setItem(LS_RAIL_L,rl.classList.contains("collapsed")?"1":"0");
    scheduleRender();
  };
  $("toggle-r").onclick=()=>{
    rr.classList.toggle("collapsed");
    localStorage.setItem(LS_RAIL_R,rr.classList.contains("collapsed")?"1":"0");
    scheduleRender();
  };
  $("overview-btn").onclick=()=>{S.session="__overview__";S._fitted=false;S.nodePos.clear();loadSnapshot(true);renderSessList();};
  $("usage-btn").onclick=()=>{S.usageOpen=!S.usageOpen;renderUsagePanel();};
  $("stats-bar").onclick=()=>{S.usageOpen=!S.usageOpen;renderUsagePanel();};
  $("dashboard-btn").onclick=()=>{
    if(window.__amOpenDashboard)window.__amOpenDashboard("dashboard");
    else{
      const s=document.createElement("script");
      s.type="module";s.src="/panels/loader.js";
      document.body.appendChild(s);
      s.onload=()=>{ if(window.__amOpenDashboard)window.__amOpenDashboard("dashboard"); };
    }
  };
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){S.usageOpen=false;renderUsagePanel();}});
}

/* ---------- 数据 ---------- */
function apiPost(path,body){
  return fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Auth-Token":S.token},body:JSON.stringify(body)})
    .then(async r=>{const d=await r.json().catch(()=>({error:"响应不是 JSON"}));if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d;});
}
function loadConfig(){
  const params=new URLSearchParams(location.hash.slice(1));
  S.token=params.get("token")||"";
  if(S.token){
    // 注入全局供 loader/panels 使用（写法带空格，避免被 daemon 注入探测误判）
    window.__amToken = S.token;
    history.replaceState(null,"",location.pathname+location.search);
  }
  fetch("/api/protocol",{headers:{"X-Auth-Token":S.token}}).then(r=>r.json()).then(d=>{
    if(d&&d.version)$("foot-ver").textContent="protocol v"+d.version+" · agent-mcp";
  }).catch(()=>{});
}
function clearState(){
  S.agents=new Map();S.children=new Map();S.eventLog=new Map();S.usage=new Map();
  S.deltas=new Map();S.curTool=new Map();S.seen=new Set();S.lastSeq=0;S.msgsShown=MSG_PAGE;
  S.nodeEls.forEach(el=>el.remove());S.nodeEls.clear();S._fitted=false;
  scheduleRender();
}
async function loadSnapshot(reset){
  if(reset)clearState();
  const q=(S.session&&S.session!=="__overview__")?"?session_id="+encodeURIComponent(S.session):"";
  try{
    const r=await fetch("/api/snapshot"+q,{headers:{"X-Auth-Token":S.token}});
    if(!r.ok){S.snapErr="快照不可用 ("+r.status+")";scheduleRender();return;}
    applySnapshot(await r.json(),reset);S.snapErr="";
  }catch(e){S.snapErr="无法连接 daemon";scheduleRender();}
}
function applySnapshot(s,focusLatest=false){
  const kept=[...S.eventLog.entries()].filter(([seq])=>seq>(s.last_seq||0));
  S.eventLog.clear();
  for(const e of s.events||[])if(typeof e.seq==="number")S.eventLog.set(e.seq,e);
  for(const [seq,e]of kept)S.eventLog.set(seq,e);
  S.seen=new Set(S.eventLog.keys());
  S.lastSeq=s.last_seq||0;
  S.agents=new Map((s.agents||[]).map(a=>[a.id,a]));
  rebuildChildren();
  for(const u of((s.usage||{}).per_agent)||[])S.usage.set(u.agent_id,u);
  rebuildSessions();
  if(focusLatest||!S.agents.has(S.selected))S.selected=latestAgent();
  localStorage.setItem(SEQ_KEY,String(S.lastSeq));
  renderSessList();
  scheduleRender();
}
function rebuildChildren(){
  S.children=new Map();
  for(const a of S.agents.values())if(a.parent_id!=null){
    if(!S.children.has(a.parent_id))S.children.set(a.parent_id,[]);
    S.children.get(a.parent_id).push(a.id);
  }
}
function rebuildSessions(){
  S.sessions=new Map();
  for(const a of S.agents.values()){
    const sid=a.session_id||"unknown";
    if(!S.sessions.has(sid))S.sessions.set(sid,{id:sid,agents:[],run:0,ok:0,bad:0,last:0,tasks:[]});
    const g=S.sessions.get(sid);
    g.agents.push(a);
    if(a.status==="running"||a.status==="queued")g.run++;
    else if(a.status==="terminated")g.ok++;
    else if(["error","cancelled","incomplete","needs_advisor"].includes(a.status))g.bad++;
    const t=Date.parse(a.updated_at||a.created_at||"")||0;
    if(t>g.last)g.last=t;
    if(a.task_name&&g.tasks.length<4&&!g.tasks.includes(a.task_name))g.tasks.push(a.task_name);
  }
}
function latestAgent(){
  const pool=(S.session&&S.session!=="__overview__")
    ?[...S.agents.values()].filter(a=>(a.session_id||"unknown")===S.session)
    :[...S.agents.values()];
  pool.sort((x,y)=>{
    const xt=Date.parse(x.created_at||"")||0,yt=Date.parse(y.created_at||"")||0;
    return yt-xt||(Number(y.id)||0)-(Number(x.id)||0);
  });
  return pool.length?pool[0].id:null;
}
function scheduleSnapshot(){
  if(S.snapTimer)return;
  S.snapTimer=setTimeout(()=>{S.snapTimer=null;loadSnapshot(false);},400);
}
function connect(){
  const last=localStorage.getItem(SEQ_KEY);
  const qs=new URLSearchParams();
  if(last)qs.set("last_seq",last);
  if(S.token)qs.set("token",S.token);
  const es=new EventSource("/events"+(qs.toString()?"?"+qs.toString():""));
  S.sseEs=es;S.sse="connecting";S.sseRetry=0;
  es.onopen=()=>{S.sse="connected";S.sseRetry=0;scheduleRender();};
  es.onerror=()=>{
    S.sse="reconnecting";scheduleRender();
    try{es.close();}catch(e){}
    S.sseEs=null;
    const delays=[1000,2000,5000];
    setTimeout(()=>{if(S.sse==="reconnecting")connect();},delays[Math.min(S.sseRetry,delays.length-1)]);
    S.sseRetry++;
  };
  for(const t of EVENT_TYPES)es.addEventListener(t,e=>onEvent(t,e));
}
function onEvent(type,ev){
  let data;try{data=JSON.parse(ev.data);}catch(e){return;}
  const seq=ev.lastEventId?parseInt(ev.lastEventId,10):null,payload=data.payload||{},aid=data.agent_id==null?null:Number(data.agent_id);
  if(seq!=null&&!isNaN(seq)){
    if(S.seen.has(seq))return;
    S.seen.add(seq);S.eventLog.set(seq,data);
    if(seq>S.lastSeq){S.lastSeq=seq;localStorage.setItem(SEQ_KEY,String(seq));}
  }
  if(type==="agent.spawned"&&!S.agents.has(aid)){scheduleSnapshot();return;}
  else if(["agent.running","agent.error","agent.cancelled"].includes(type)&&S.agents.has(aid)){
    const a=S.agents.get(aid);a.status=type.slice(6);
    if(payload.stop_reason)a.stop_reason=payload.stop_reason;
  }else if(type==="agent.terminated"&&S.agents.has(aid)){
    const a=S.agents.get(aid);
    a.status=payload.stop_reason==="timeout"?"incomplete":"terminated";
    a.stop_reason=payload.stop_reason;
  }else if(type==="agent.needs_advisor"&&S.agents.has(aid)){
    const a=S.agents.get(aid);a.status="needs_advisor";
    if(payload.question)a.stop_reason=String(payload.question).slice(0,120);
  }else if(type==="agent.orphaned"&&S.agents.has(aid)){
    const a=S.agents.get(aid);a.status="incomplete";a.stop_reason="orphaned";
  }else if(type==="agent.verify_failed"&&S.agents.has(aid)){
    const a=S.agents.get(aid);a.stop_reason="verify_failed(attempt "+String(payload.attempt||1)+")";
  }else if(type==="agent.verify_passed"&&S.agents.has(aid)){
    const a=S.agents.get(aid);a.stop_reason="verify_passed";
  }else if(type==="agent.message"&&aid!=null){S.deltas.delete(aid);}
  else if(type==="agent.message_delta"&&aid!=null){S.deltas.set(aid,(S.deltas.get(aid)||"")+String(payload.delta||""));}
  else if(type==="agent.tool_use"&&aid!=null){S.curTool.set(aid,payload);}
  else if(type==="agent.usage"&&aid!=null){S.usage.set(aid,payload);}
  rebuildSessions();renderSessList();scheduleRender();
}

/* ---------- 会话栏：文件夹分类 ---------- */
function loadFolderPrefs(){
  try{
    const raw=localStorage.getItem(LS_FOLDER);
    if(!raw)return;
    const obj=JSON.parse(raw)||{};
    for(const [k,v] of Object.entries(obj))S.folderOpen.set(k,!!v);
  }catch(e){/* ignore */}
}
function saveFolderPrefs(){
  try{
    const obj={};
    for(const [k,v] of S.folderOpen)obj[k]=v;
    localStorage.setItem(LS_FOLDER,JSON.stringify(obj));
  }catch(e){/* ignore */}
}
function sessionFolder(sid){
  const s=String(sid||"unknown");
  if(s==="default")return"default";
  if(s.startsWith("omp-"))return"omp";
  if(s.startsWith("release"))return"release";
  if(s.startsWith("optical"))return"optical";
  if(s.startsWith("capability"))return"capability";
  if(s.startsWith("unknown"))return"unknown";
  if(/^[0-9a-f]{8}-/i.test(s))return"uuid";
  const i=s.indexOf("-");
  return i>0?s.slice(0,i):"other";
}
const FOLDER_LABEL={
  default:"Default",omp:"OMP",release:"Release",optical:"Optical",
  capability:"Capability",unknown:"Unknown",uuid:"UUID",other:"Other",
};
function renderSessList(){
  const box=$("sess-list");
  const list=[...S.sessions.values()].sort((a,b)=>b.last-a.last||b.agents.length-a.agents.length);
  const overviewActive=S.session==="__overview__";
  let html=`<button class="sess-row ${overviewActive?"active":""}" data-sid="__overview__">
    <div class="sr-name">全部会话</div>
    <div class="sr-meta"><span class="sr-chip">${list.length} 会话</span><span class="sr-chip">${S.agents.size} agent</span></div>
  </button>`;
  const groups=new Map();
  for(const g of list){
    const k=sessionFolder(g.id);
    if(!groups.has(k))groups.set(k,[]);
    groups.get(k).push(g);
  }
  const order=["default","omp","release","optical","capability","uuid","unknown","other"];
  const keys=[...groups.keys()].sort((a,b)=>{
    const ia=order.indexOf(a),ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);
  });
  for(const k of keys){
    const items=groups.get(k);
    const open=S.folderOpen.has(k)?S.folderOpen.get(k):(k==="default"||k==="omp"||k==="release");
    html+=`<div class="folder ${open?"":"collapsed"}" data-folder="${esc(k)}">
      <button type="button" class="folder-hd" data-fx="${esc(k)}">
        <span class="fx">${open?"▾":"▸"}</span>
        <span>${esc(FOLDER_LABEL[k]||k)}</span>
        <span class="fc">${items.length}</span>
      </button>
      <div class="folder-body">${items.map(g=>{
        const active=S.session===g.id;
        return `<button class="sess-row ${active?"active":""}" data-sid="${esc(g.id)}">
          <div class="sr-name" title="${esc(g.id)}">${esc(shortLabel(g.id,26))}</div>
          <div class="sr-meta">
            <span class="sr-chip">${g.agents.length}</span>
            ${g.run?`<span class="sr-chip run">${g.run}</span>`:""}
            ${g.ok?`<span class="sr-chip ok">${g.ok}</span>`:""}
            ${g.bad?`<span class="sr-chip err">${g.bad}</span>`:""}
          </div>
        </button>`;
      }).join("")}</div>
    </div>`;
  }
  box.innerHTML=html||`<div class="empty">暂无会话</div>`;
  box.querySelectorAll(".folder-hd").forEach(btn=>{
    btn.onclick=()=>{
      const k=btn.dataset.fx;
      const fold=btn.closest(".folder");
      const willOpen=fold.classList.contains("collapsed");
      fold.classList.toggle("collapsed",!willOpen);
      S.folderOpen.set(k,willOpen);
      saveFolderPrefs();
      btn.querySelector(".fx").textContent=willOpen?"▾":"▸";
    };
  });
  box.querySelectorAll(".sess-row").forEach(btn=>{
    btn.onclick=()=>{
      const sid=btn.dataset.sid;
      S.session=sid;S._fitted=false;S.selected=null;S.nodePos.clear();
      loadSnapshot(true);
      if(sid!=="__overview__")$("hint-text").textContent="会话 "+shortLabel(sid,36)+" · 顶栏切换 agent · 空白拖动画布 · 节点可拖";
      else $("hint-text").textContent="选择左侧会话查看对话树 · 文件夹可折叠分类";
      renderSessList();
    };
  });
}

/* ---------- 顶栏 Agent 切换（running 优先 + 限流） ---------- */
const AGENT_CHIP_MAX = 14;
function renderAgentBar(){
  const box=$("agent-chips");
  if(!box)return;
  if(S.session==="__overview__"){
    box.innerHTML=`<span style="color:var(--ink-soft);font-size:11px">选择会话后在此切换 agent</span>`;
    return;
  }
  const all=agentsInScope().sort((a,b)=>{
    const rank=s=>s==="running"?0:s==="queued"?1:s==="needs_advisor"?2:3;
    const ra=rank(a.status),rb=rank(b.status);
    if(ra!==rb)return ra-rb;
    return (b.id||0)-(a.id||0);
  });
  if(!all.length){
    box.innerHTML=`<span style="color:var(--ink-soft);font-size:11px">该会话暂无 agent</span>`;
    return;
  }
  // 始终包含当前选中
  const picked=[];
  const seen=new Set();
  const push=a=>{if(a&&!seen.has(a.id)){seen.add(a.id);picked.push(a);}};
  push(all.find(a=>a.id===S.selected));
  for(const a of all){if(picked.length>=AGENT_CHIP_MAX)break;push(a);}
  const overflow=all.length-picked.length;
  box.innerHTML=picked.map(a=>`
    <button type="button" class="agent-chip ${S.selected===a.id?"active":""}" data-aid="${a.id}" title="#${a.id} ${esc(a.task_name||"")}">
      <span class="ac-dot" style="background:${statusColor(a.status)}"></span>
      <span>${esc(shortLabel(a.task_name||("#"+a.id),18))}</span>
      <span class="ac-cli">${esc(String(a.cli||"").toUpperCase())}</span>
    </button>`).join("")
    +(overflow>0?`<select id="agent-more" class="agent-more" title="其余 ${overflow} 个 agent">
      <option value="">+${overflow} 更多…</option>
      ${all.filter(a=>!seen.has(a.id)).map(a=>`<option value="${a.id}">${esc(shortLabel(a.task_name||("#"+a.id),28))} · ${esc(String(a.cli||"").toUpperCase())} · ${esc(statusLabel(a.status))}</option>`).join("")}
    </select>`:"");
  box.querySelectorAll(".agent-chip").forEach(btn=>{
    btn.onclick=()=>{
      selectAgent(Number(btn.dataset.aid));
      if($("rail-r").classList.contains("collapsed")){
        $("rail-r").classList.remove("collapsed");
        localStorage.setItem(LS_RAIL_R,"0");
      }
      focusNodeOnCanvas(Number(btn.dataset.aid));
      renderAgentBar();
    };
  });
  const more=box.querySelector("#agent-more");
  if(more)more.onchange=()=>{
    const id=Number(more.value);
    if(!id)return;
    selectAgent(id);
    focusNodeOnCanvas(id);
    renderAgentBar();
  };
}
/* 画布 pan 到指定 agent 节点 */
function focusNodeOnCanvas(agentId){
  const scroll=$("graph-scroll");
  if(!scroll||scroll.classList.contains("cards-mode"))return;
  const g=S.lastGraph,l=S.lastLayout;
  if(!g||!l)return;

/* ---------- 图：自上而下画布 + 流动边 + 节点可拖 ---------- */
const NW={session:200,turn:220,agent:240}, NH={session:48,turn:36,agent:56};
const COL_GAP=28, ROW_GAP=36, PAD=40;

function agentsInScope(){
  if(S.session==="__overview__")return[];
  return [...S.agents.values()].filter(a=>(a.session_id||"unknown")===S.session);
}
function userTurns(aid){
  return [...S.eventLog.values()].filter(e=>e.agent_id===aid&&e.type==="agent.user_turn")
    .sort((a,b)=>(a.seq||0)-(b.seq||0));
}
function buildGraph(){
  const nodes=new Map(),edges=[],lastRun=new Map();
  const list=agentsInScope().sort((x,y)=>x.id-y.id);
  if(!list.length)return{nodes,edges};
  const sid=S.session,skey="s:"+sid;
  nodes.set(skey,{key:skey,type:"session",label:"会话 "+shortLabel(sid,18),count:list.length});
  for(const a of list){
    const turns=userTurns(a.id);
    const turnsL=turns.length?turns:[{seq:"legacy",payload:{text:a.task_name||"派发任务",kind:"spawn"}}];
    let previous=null;
    for(let i=0;i<turnsL.length;i++){
      const turn=turnsL[i],suffix=String(turn.seq||i),tkey=`t:${a.id}:${suffix}`,rkey=`r:${a.id}:${suffix}`;
      nodes.set(tkey,{key:tkey,type:"turn",agentId:a.id,label:String(turn.payload?.text||"用户输入"),kind:turn.payload?.kind||"spawn"});
      nodes.set(rkey,{key:rkey,type:"agent",agent:a});
      let from=previous;
      if(!from&&a.parent_id!=null)from=lastRun.get(a.parent_id);
      if(!from)from=skey;
      edges.push([from,tkey],[tkey,rkey]);
      previous=rkey;
    }
    lastRun.set(a.id,previous);
  }
  return{nodes,edges};
}
/* 自上而下：depth → Y，叶子序 → X 展开 */
function layoutTree(g){
  const children=new Map(),indeg=new Set();
  for(const [f,t]of g.edges){
    if(!g.nodes.has(f)||!g.nodes.has(t))continue;
    if(!children.has(f))children.set(f,[]);
    children.get(f).push(t);indeg.add(t);
  }
  const roots=[...g.nodes.keys()].filter(k=>!indeg.has(k));
  const depths=new Map(),spans=new Map();let leafCount=0,maxDepth=0;
  function measure(k,depth){
    depths.set(k,depth);maxDepth=Math.max(maxDepth,depth);
    const kids=(children.get(k)||[]).slice().sort((a,b)=>{
      const na=g.nodes.get(a),nb=g.nodes.get(b);
      if(na?.type==="agent"&&nb?.type==="agent")return (na.agent.id||0)-(nb.agent.id||0);
      return String(a).localeCompare(String(b));
    });
    if(!kids.length){const span={first:leafCount,last:leafCount};leafCount++;spans.set(k,span);return span;}
    let first=null,last=null;
    for(const kid of kids){
      const sp=measure(kid,depth+1);
      if(!first)first=sp;last=sp;
    }
    const span={first:first.first,last:last.last};spans.set(k,span);return span;
  }
  for(const r of roots)measure(r,0);
  const pos=new Map();
  const rowH=[];for(let i=0;i<=maxDepth;i++)rowH.push(0);
  for(const [k,n]of g.nodes)rowH[depths.get(k)||0]=Math.max(rowH[depths.get(k)||0],NH[n.type]);
  const yAt=[];let acc=PAD;
  for(let i=0;i<=maxDepth;i++){yAt[i]=acc;acc+=rowH[i]+ROW_GAP;}
  const totalH=acc-PAD/2;
  const leafW=Math.max(...[...g.nodes.values()].map(n=>NW[n.type]))+COL_GAP;
  let maxRight=0;
  for(const [k,n]of g.nodes){
    const span=spans.get(k),depth=depths.get(k)||0;
    const mid=(span.first+span.last)/2;
    const x=PAD+mid*leafW;
    const y=yAt[depth]+(rowH[depth]-NH[n.type])/2;
    pos.set(k,{x,y});
    maxRight=Math.max(maxRight,x+NW[n.type]);
  }
  return{pos,width:maxRight+PAD,height:totalH+PAD};
}
/* 手动拖过的节点覆盖自动布局 */
function applyOverrides(g,l){
  for(const [key,ov]of S.nodePos){
    if(g.nodes.has(key))l.pos.set(key,{x:ov.x,y:ov.y});
  }
}
function nodeBox(n,p){
  return{x:p.x,y:p.y,w:NW[n.type],h:NH[n.type],
         cx:p.x+NW[n.type]/2,cy:p.y+NH[n.type]/2};
}
function edgePath(a,b){
  /* 自上而下：上底中点 → 下顶中点，垂直贝塞尔 + 流动动画 */
  const x1=a.cx,y1=a.y+a.h,x2=b.cx,y2=b.y;
  const dy=Math.max(24,(y2-y1)*0.45);
  return `M ${x1} ${y1} C ${x1} ${y1+dy}, ${x2} ${y2-dy}, ${x2} ${y2}`;
}
function renderGraph(){
  const scroll=$("graph-scroll"),vp=$("graph-viewport"),emptyEl=scroll.querySelector(".graph-empty");
  if(S.session==="__overview__"){
    scroll.classList.add("cards-mode");
    // 清空树节点，但保留 #graph-nodes / #graph-edges 容器本身
    S.nodeEls.forEach(el=>el.remove());S.nodeEls.clear();
    const gn=$("graph-nodes"),ge=$("graph-edges");
    if(gn)gn.innerHTML=""; if(ge)ge.innerHTML="";
    renderSessionCards(scroll,emptyEl,vp);
    return;
  }
  scroll.classList.remove("cards-mode");
  const cards=$("sess-cards"); if(cards){cards.hidden=true;}
  const g=buildGraph();S.lastGraph=g;
  if(!g.nodes.size){
    $("graph-nodes").innerHTML="";$("graph-edges").innerHTML="";
    S.nodeEls.forEach(el=>el.remove());S.nodeEls.clear();
    emptyEl.hidden=false;
    emptyEl.textContent=S.sse==="connected"?"该会话暂无节点":"正在连接 daemon…";
    return;
  }
  emptyEl.hidden=true;
  const l=layoutTree(g);applyOverrides(g,l);S.lastLayout=l;
  if(!S._fitted){
    S._fitted=true;
    const cw=scroll.clientWidth,ch=scroll.clientHeight;
    const z=Math.min(1,Math.max(0.45,Math.min((cw-48)/l.width,(ch-48)/l.height)));
    S.zoom=z;
    S.pan.x=(cw-l.width*z)/2;
    S.pan.y=Math.min(24,(ch-l.height*z)/2);
  }
  vp.style.transform=`translate(${S.pan.x}px,${S.pan.y}px) scale(${S.zoom})`;
  const edges=$("graph-edges"),layer=$("graph-nodes");
  edges.setAttribute("width",l.width);edges.setAttribute("height",l.height);
  edges.setAttribute("viewBox",`0 0 ${l.width} ${l.height}`);
  layer.style.width=l.width+"px";layer.style.height=l.height+"px";
  const chain=ancestorChain(g);
  const reduceMotion=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const flows=[];
  for(const [f,t]of g.edges){
    const pf=l.pos.get(f),pt=l.pos.get(t);
    if(!pf||!pt)continue;
    const nf=g.nodes.get(f),nt=g.nodes.get(t);
    const d=edgePath(nodeBox(nf,pf),nodeBox(nt,pt));
    const on=chain.has(t);
    const live=!reduceMotion&&(nf.type==="agent"&&nf.agent.status==="running"
      ||nt.type==="agent"&&nt.agent.status==="running"
      ||nt.type==="agent"&&nt.agent.status==="queued"
      ||on);
    flows.push(`<path d="${d}" class="${on?"on ":""}${live?"flow":""}" data-edge="${esc(f)}→${esc(t)}"/>`);
  }
  edges.innerHTML=flows.join("");
  const seen=new Set();
  for(const n of g.nodes.values()){
    seen.add(n.key);
    let el=S.nodeEls.get(n.key);
    if(!el){el=createNodeEl(n);S.nodeEls.set(n.key,el);layer.appendChild(el);}
    updateNodeEl(el,n,l.pos.get(n.key));
  }
  for(const [k,el]of[...S.nodeEls])if(!seen.has(k)){el.remove();S.nodeEls.delete(k);}
}

function ancestorChain(g){
  const inc=new Map();for(const [f,t]of g.edges)inc.set(t,f);
  const out=new Set();let cur=null;
  for(const k of g.nodes.keys()){
    const n=g.nodes.get(k);
    if((n.type==="agent"&&n.agent.id===S.selected)||(n.type==="turn"&&n.agentId===S.selected))cur=k;
  }
  while(cur){out.add(cur);cur=inc.get(cur);}
  return out;
}
function createNodeEl(n){
  const el=document.createElement("div");
  el.className="node "+n.type+" fresh";
  el.dataset.key=n.key;
  el.dataset.agent=n.agentId||n.agent?.id||"";
  if(n.type==="session"){
    el.innerHTML='<div class="nsub">CONVERSATION</div><div class="ntitle"></div>';
  }else if(n.type==="turn"){
    el.innerHTML='<div class="ntitle"></div>';
  }else{
    el.innerHTML=`<span class="ndot"></span><div class="nmain"><div class="ntitle"></div><div class="nsub"></div></div><span class="nbadges"></span>`;
  }

}
function updateNodeEl(el,n,p){
  el.style.transform=`translate(${p.x}px,${p.y}px)`;
  if(n.type==="session"){
    el.querySelector(".ntitle").textContent=n.label;
  }else if(n.type==="turn"){
    el.querySelector(".ntitle").textContent=(n.kind&&n.kind!=="spawn"?n.kind+" · ":"输入 · ")+shortLabel(n.label,20);
  }else{
    const a=n.agent;
    for(const c of["running","queued","terminated","error","cancelled","incomplete","needs_advisor"])el.classList.remove("st-"+c);
    if(a.status)el.classList.add("st-"+a.status);
    el.classList.toggle("sel",a.id===S.selected);
    el.querySelector(".ndot").style.background=cliColor(a.cli);
    el.querySelector(".ntitle").textContent=shortLabel(a.task_name||String(a.id),24);
    el.querySelector(".nsub").textContent=a.status==="running"
      ?(currentActivity(a)||"▸ 运行中")
      :(String(a.cli||"").toUpperCase()+" · "+statusLabel(a.status));
    const anoms=a.anomalies||[];
    el.querySelector(".nbadges").innerHTML=anoms.length
      ?anoms.map(an=>`<span class="badge ${an.kind==="stuck_loop"||an.kind==="timeout"?"stuck":an.kind==="silent"?"silent":"fail"}">${esc(anomalyLabel(an.kind))}</span>`).join("")
      :"";
  }
}
function currentActivity(a){
  const t=S.curTool.get(a.id);if(t)return"▸ "+String(t.name||"tool");
  const d=S.deltas.get(a.id);return d&&d.trim()?"▸ "+shortLabel(d.trim(),24):null;

function setupGraphNav(){
  const scroll=$("graph-scroll"),layer=$("graph-nodes");
  /* 画布拖：仅空白区 / 连线区；节点上按下则拖节点 */
  scroll.addEventListener("mousedown",e=>{
    if(scroll.classList.contains("cards-mode"))return;
    const nodeEl=e.target.closest(".node");
    if(nodeEl&&nodeEl.dataset.key&&!nodeEl.classList.contains("session")){
      e.preventDefault();e.stopPropagation();
      const key=nodeEl.dataset.key;
      const pos=S.lastLayout?.pos?.get(key)||{x:0,y:0};
      S.nodeDrag={key,el:nodeEl,x0:e.clientX,y0:e.clientY,ox:pos.x,oy:pos.y,moved:false};
      nodeEl.classList.add("dragging");
      return;
    }
    S.drag={x:e.clientX,y:e.clientY,px:S.pan.x,py:S.pan.y,moved:false};
    scroll.classList.add("grabbing");
  });
  window.addEventListener("mousemove",e=>{
    if(S.nodeDrag){
      const dx=(e.clientX-S.nodeDrag.x0)/S.zoom,dy=(e.clientY-S.nodeDrag.y0)/S.zoom;
      if(Math.abs(dx)+Math.abs(dy)>2)S.nodeDrag.moved=true;
      const nx=S.nodeDrag.ox+dx,ny=S.nodeDrag.oy+dy;
      S.nodePos.set(S.nodeDrag.key,{x:nx,y:ny});
      if(S.lastLayout)S.lastLayout.pos.set(S.nodeDrag.key,{x:nx,y:ny});
      S.nodeDrag.el.style.transform=`translate(${nx}px,${ny}px)`;
      redrawEdgesOnly();
      return;
    }
    if(!S.drag)return;
    const dx=e.clientX-S.drag.x,dy=e.clientY-S.drag.y;
    if(Math.abs(dx)+Math.abs(dy)>3)S.drag.moved=true;
    S.pan.x=S.drag.px+dx;S.pan.y=S.drag.py+dy;
    $("graph-viewport").style.transform=`translate(${S.pan.x}px,${S.pan.y}px) scale(${S.zoom})`;
  });
  window.addEventListener("mouseup",()=>{
    if(S.nodeDrag){
      S.nodeDrag.el.classList.remove("dragging");
      S.dragMoved=S.nodeDrag.moved;S.nodeDrag=null;scheduleRender();return;
    }
    if(!S.drag)return;
    S.dragMoved=S.drag.moved;S.drag=null;scroll.classList.remove("grabbing");
  });
  scroll.addEventListener("wheel",e=>{
    if(scroll.classList.contains("cards-mode"))return;
    e.preventDefault();
    const r=scroll.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    const factor=e.deltaY<0?1.08:1/1.08,nz=Math.max(0.35,Math.min(2.8,S.zoom*factor));
    S.pan.x=mx-(mx-S.pan.x)*(nz/S.zoom);S.pan.y=my-(my-S.pan.y)*(nz/S.zoom);S.zoom=nz;
    $("graph-viewport").style.transform=`translate(${S.pan.x}px,${S.pan.y}px) scale(${S.zoom})`;
  },{passive:false});
  layer.addEventListener("click",e=>{
    if(S.dragMoved){S.dragMoved=false;return;}
    const el=e.target.closest(".node");
    if(!el||el.classList.contains("session")||!el.dataset.agent)return;
    selectAgent(Number(el.dataset.agent));
    if($("rail-r").classList.contains("collapsed")){
      $("rail-r").classList.remove("collapsed");
      localStorage.setItem(LS_RAIL_R,"0");
    }
    renderAgentBar();
  });
  window.addEventListener("resize",()=>scheduleRender());
}
function redrawEdgesOnly(){
  const g=S.lastGraph,l=S.lastLayout;
  if(!g||!l)return;
  const chain=ancestorChain(g);
  const reduceMotion=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const flows=[];
  for(const [f,t]of g.edges){
    const pf=l.pos.get(f),pt=l.pos.get(t);if(!pf||!pt)continue;
    const nf=g.nodes.get(f),nt=g.nodes.get(t);
    const d=edgePath(nodeBox(nf,pf),nodeBox(nt,pt));
    const on=chain.has(t);
    const live=!reduceMotion&&(nf.agent?.status==="running"||nt.agent?.status==="running"
      ||nt.agent?.status==="queued"||on);
    flows.push(`<path d="${d}" class="${on?"on ":""}${live?"flow":""}"/>`);
  }
  $("graph-edges").innerHTML=flows.join("");
}

const _actCache=new Map();
async function loadAgentActivity(id){
  if(_actCache.has(id))return;
  try{
    const r=await fetch("/api/agents/activity?agent_id="+id,{headers:{"X-Auth-Token":S.token}});
    if(!r.ok)return;
    const data=await r.json();
    const evs=Array.isArray(data)?data:(data.events||[]);

      if(e&&typeof e.seq==="number"&&!S.eventLog.has(e.seq)){

}

    </h2>
    <div class="subtitle">#${esc(a.id)} · ${esc(a.status)}${a.stop_reason?" · "+esc(a.stop_reason):""}${a.model?" · "+esc(a.model):""}</div>
    ${(a.anomalies||[]).length?`<div class="badges">${a.anomalies.map(an=>`<span class="badge fail">${esc(anomalyLabel(an.kind))}</span>`).join("")}</div>`:""}
    ${firstTurn?`<div class="dk">任务 prompt</div><div class="msg">${esc(firstTurn)}</div>`:""}
    <div class="dk">当前活动</div>
    <div class="cur-act">${act?`<span class="ico"></span>${esc(act.slice(2))}`:'<span class="in">'+(running?"运行中…":"无进行中活动")+'</span>'}</div>
    <div class="dk">消息</div>
    <div class="msgs">${shown.map(m=>`<div class="msg"><span class="seq">#${m.seq}</span>${esc(String(m.payload?.text||"").slice(0,3000))}</div>`).join("")}
      ${delta?`<div class="msg delta">${esc(delta.slice(-1000))}</div>`:""}
      ${!shown.length&&!delta?`<div class="empty">${firstTurn?"暂无回复消息（上方为任务 prompt）":"暂无消息——可从 /api/agents/activity 拉取或该 agent 无输出"}</div>`:""}</div>
    <div class="dk">最近事件</div>
    <div class="events">${evs.map(e=>{
      const tpCls=e.type.includes("tool")?"use":e.type.includes("message")?"msg":e.type==="agent.error"?"err":e.type==="agent.terminated"?"term":"";
      return `<div class="ev"><span class="seq">#${e.seq||"—"}</span><span class="tp ${tpCls}">${esc(e.type)}</span><span class="py">${esc(payloadSummary(e))}</span></div>`;
    }).join("")||'<div class="empty">暂无事件</div>'}</div>
    <div class="dk">操作</div>
    <div class="operator">
      <div class="mode-tabs">
        <button type="button" data-mode="steer" class="${S.opMode==="steer"?"active":""}">中途插话</button>
        <button type="button" data-mode="followup" class="${S.opMode==="followup"?"active":""}">继续会话</button>
      </div>
      <label for="op-message">${S.opMode==="steer"?"中途插话":"继续会话"}</label>
      <textarea id="op-message" maxlength="20000" placeholder="输入新的方向或下一步任务"></textarea>
      <div class="op-actions">
        <button id="op-send" class="op-btn primary" type="button" ${S.opBusy||(!running&&S.opMode==="steer")?"disabled":""}>发送</button>
        <button id="op-stop" class="op-btn danger" type="button" ${S.opBusy||!running?"disabled":""}>停止</button>
        <span class="op-note">${S.opMode==="steer"?"终止当前 run 后续接":"稳定 session 恢复"}</span>
      </div>
      <div class="op-feedback ${S.opFeedback.startsWith("失败")?"error":""}">${esc(S.opFeedback)}</div>
    </div>`;
  pane.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.opMode=b.dataset.mode;detailFingerprint="";scheduleRender();});
  pane.querySelector("#op-send")?.addEventListener("click",async()=>{
    const message=(pane.querySelector("#op-message")?.value||"").trim();
    if(!message){S.opFeedback="失败：请输入内容";detailFingerprint="";scheduleRender();return;}
    S.opBusy=true;detailFingerprint="";scheduleRender();
    const path=S.opMode==="steer"?"/api/agents/steer":"/api/agents/followup";
    const body=S.opMode==="steer"?{agent_id:a.id,message,session_id:a.session_id}:{agent_id:a.id,prompt:message,session_id:a.session_id};
    try{
      const r=await apiPost(path,body);
      S.opFeedback=(r.resumed_session_id?"已恢复原会话":"已创建下一 turn")+(r.status?" · "+r.status:"");
    }catch(err){S.opFeedback="失败："+err.message;}
    finally{S.opBusy=false;detailFingerprint="";loadSnapshot(false);}
  });
  pane.querySelector("#op-stop")?.addEventListener("click",async()=>{
    S.opBusy=true;detailFingerprint="";scheduleRender();
    try{await apiPost("/api/agents/interrupt",{agent_id:a.id,session_id:a.session_id});S.opFeedback="已发送停止请求";}
    catch(err){S.opFeedback="失败："+err.message;}
    finally{S.opBusy=false;detailFingerprint="";loadSnapshot(false);}
  });
}
function renderHeader(){
  let run=0,q=0,done=0,fail=0,tok=0,cost=0;
  for(const a of S.agents.values()){
    if(a.status==="running")run++;else if(a.status==="queued")q++;else if(a.status==="terminated")done++;else fail++;
    const u=S.usage.get(a.id);
    if(u){tok+=num(u.input_tokens)+num(u.output_tokens)+num(u.cache_creation)+num(u.cache_read);cost+=num(u.cost_usd);}
  }
  const upd=(id,v)=>{const el=$(id);if(el&&el.textContent!=String(v))el.textContent=v;};
  upd("st-run",run);upd("st-queued",q);upd("st-done",done);upd("st-fail",fail);
  upd("st-tok",fmtTok(tok));upd("st-cost","$"+cost.toFixed(4));
}
function renderUsagePanel(){
  const panel=$("usage-panel");
  if(!S.usageOpen){panel.hidden=true;return;}
  panel.hidden=false;
  let html='<div class="dk" style="margin:0 0 8px">Per-Agent Token</div>';
  const ags=[...S.agents.values()].sort((a,b)=>b.id-a.id).slice(0,40);
  if(!ags.length){panel.innerHTML=html+'<div class="empty">暂无用量</div>';return;}
  let totIn=0,totOut=0,totCost=0;
  for(const a of ags){
    const u=S.usage.get(a.id);if(!u)continue;
    const ti=num(u.input_tokens),to=num(u.output_tokens),tcr=num(u.cache_read),tcc=num(u.cache_creation),cost=num(u.cost_usd);
    totIn+=ti;totOut+=to;totCost+=cost;
    const total=ti+to+tcr+tcc||1;
    html+=`<div class="upa"><span class="nm">${esc(shortLabel(a.task_name,28))}</span><span class="cost">$${cost.toFixed(4)}</span>
      <div class="bars"><span class="bi" style="width:${ti/total*100}%"></span><span class="bo" style="width:${to/total*100}%"></span><span class="bc" style="width:${(tcr+tcc)/total*100}%"></span></div>
      <div class="lg"><span class="bi">■</span>in ${fmtTok(ti)} <span class="bo">■</span>out ${fmtTok(to)} <span class="bc">■</span>cache ${fmtTok(tcr+tcc)}</div></div>`;
  }
  html+=`<div class="dk" style="margin:8px 0 0">合计</div><div class="upa"><b>in ${fmtTok(totIn)} · out ${fmtTok(totOut)} · cost $${totCost.toFixed(4)}</b></div>`;
  panel.innerHTML=html;
}
function renderFooter(){
  const dot=$("sse-dot"),txt=$("sse-txt"),tag=$("live-tag");
  if(S.sse==="connected"){dot.className="dot ok";txt.textContent="SSE 已连接";tag.className="live-b live";tag.textContent="LIVE";}
  else if(S.sse==="reconnecting"){dot.className="dot bad";txt.textContent="SSE 重连中（"+S.sseRetry+"）";tag.className="live-b buf";tag.textContent="BUFFERED";}
  else{dot.className="dot conn";txt.textContent="连接中…";tag.className="live-b buf";tag.textContent="BUFFERED";}
  $("sseq").textContent=S.lastSeq;$("snap-state").textContent=S.snapErr;
}

let raf=null;
function scheduleRender(){
  if(raf)return;
  raf=requestAnimationFrame(()=>{raf=null;renderAll();});
}
function renderAll(){
  if(S.drag){renderGraph();return;}
  renderHeader();renderAgentBar();renderGraph();renderDetail();renderFooter();renderUsagePanel();
}

document.addEventListener("DOMContentLoaded",()=>{
  bindChrome();loadConfig();loadFolderPrefs();setupGraphNav();
  const saved=parseInt(localStorage.getItem(SEL_KEY),10);
  if(Number.isFinite(saved)&&saved>0)S.selected=saved;
  renderSessList();loadSnapshot(true);connect();
});
</script>
<script type="module" src="/panels/loader.js"></script>
</body>
