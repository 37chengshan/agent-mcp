# DSH（DeepSeek Harness）接入 agent-mcp —— 临时试用 patch（默认关闭）
#
# 单一事实来源：packages/dsh-plugin/cordis.patch.yml（`dsh plugin add` 主路径的 bundle 载荷）。
# 本文件仅作手工 fallback 摘录，字段以 packages 为准；勿在此单独演进。
#
# 用法：dsh web --patch /绝对路径/examples/dsh/agentmcp.cordis.yml
# 持久启用（主路径）：dsh plugin --profile web add dsh-plugin-agentmcp
#          或 github:37chengshan/agent-mcp/packages/dsh-plugin / 本地 ./packages/dsh-plugin
# 持久启用（回退）：把下面的 insert 块合并进 $DSH_HOME/profiles/<name>/cordis.patch.yml
#          或 $DSH_HOME/cordis.patch.yml（先读后追加，勿覆盖已有文件）。
# 详见 docs/dsh-integration.md 与 packages/dsh-plugin/README.zh.md。
- insert:
    - id: mcp-agentmcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: agentmcp
        transport: stdio
        command: python3
        args: ['/绝对路径/agent-mcp/mcp_server.py']
        # 可选自定义项（缺省即可）：
        # env:
        #   AGENT_MCP_HOME: /绝对路径/状态目录   # 缺省 ~/.codex/agent-mcp
        #   AGENT_MCP_PORT: '8765'               # 缺省 8765
        # toolCallTimeoutMs: 120000              # 缺省 60000（wait_agent 默认 25s 循环足够）
